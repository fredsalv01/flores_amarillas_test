<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120b08">
<title>La madriguera 🐭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- las cuatro polaroids: se precargan aquí para que la textura ya esté lista al llegar al objeto -->
<link rel="preload" as="image" href="assets/photos/foto1.jpeg">
<link rel="preload" as="image" href="assets/photos/foto2.jpeg">
<link rel="preload" as="image" href="assets/photos/foto3.jpeg">
<link rel="preload" as="image" href="assets/photos/foto4.jpeg">
</head>
<body>
<div id="loading"><div class="loader-flower">🐭</div><p>Cavando la madriguera...</p></div>

<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="noise"></div>

<section id="ui">
  <div class="topbar"><span>21 · 09</span><span>para ti ♥</span></div>

  <div id="intro" class="screen active">
    <div class="intro-copy">
      <p class="kicker">Una pequeña historia</p>
      <h1>Hay una madriguera<br><i>llena de nosotros.</i></h1>
      <p>Toca el suelo para caminar. Acércate a lo que encuentres.</p>
      <button id="begin">Entrar <b>→</b></button>
    </div>
  </div>

  <div id="memory" class="photo-moment">
    <div class="memory-card">
      <div class="memory-photo"><img id="memoryPhoto" src="" alt="Un recuerdo nuestro"></div>
      <p id="memoryText"></p>
      <button class="memory-next">Seguir explorando →</button>
    </div>
  </div>

  <div id="progress" class="progress" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <p id="hint" aria-live="polite">Toca el suelo para caminar</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script type="importmap">

</script>
<script type="module" src="madriguera.js"></script>
</body>
</html>
